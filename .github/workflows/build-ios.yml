name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Xcode workspace path
        required: true
        default: ios/Metus.xcworkspace
        type: string
      scheme:
        description: Xcode application scheme
        required: true
        default: Metus
        type: string

permissions:
  contents: read

jobs:
  build:
    # macos-15 chỉ có Xcode với Swift tools tối đa 6.1 — một số Pod của Expo
    # (ví dụ ExpoModulesJSI) khai Swift tools 6.2, cần Xcode 17+ (macos-26).
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      CI: "1"
      WORKSPACE: ${{ inputs.workspace }}
      SCHEME: ${{ inputs.scheme }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      # .env bị gitignore nên CI không có — thiếu file này khiến các biến
      # EXPO_PUBLIC_GOOGLE_*/EXPO_PUBLIC_FIREBASE_API_KEY rỗng lúc Metro bundle JS,
      # làm đăng nhập Google luôn lỗi trên bản build từ GitHub. Giá trị dưới đây đều
      # là OAuth client ID / Firebase Web API key công khai (không phải secret),
      # ghi thẳng ở đây cho đồng bộ với .env dùng khi build local.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_BACKEND_API_URL=https://api.metus.vn/api
          EXPO_PUBLIC_APP_URL=https://metus.vn
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=420333529909-8acpsj3ibd5rep9kgbqgk5g03nql76ob.apps.googleusercontent.com
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyCy_sEN7eueIrvp73CxFlZDPH2xX47C2Tg
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=420333529909-a7ggckpu5r8k3l1qh8jjul0sck17kd9u.apps.googleusercontent.com
          EOF

      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios ]; then
            npx expo prebuild --platform ios --no-install
          fi

      - name: Install CocoaPods
        run: |
          if [ -f Gemfile ]; then
            bundle install
            cd ios
            bundle exec pod install
          else
            cd ios
            pod install
          fi

      - name: List available Xcode projects
        run: |
          find ios -maxdepth 1 -type d \( -name '*.xcworkspace' -o -name '*.xcodeproj' \)
          test -d "$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build Release for physical iOS devices
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee logs/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          PRODUCTS="build/Build/Products/Release-iphoneos"
          test -d "$PRODUCTS"
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo 'No device .app found in Release-iphoneos.'
            exit 1
          fi

          test -f "$APP_PATH/Info.plist"
          VERSION=$(node -p "require('./app.json').expo.version")
          TIMESTAMP=$(date -u +%Y%m%d-%H%M)
          IPA_NAME="Metus-${VERSION}-${TIMESTAMP}-unsigned.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"

          rm -rf output
          mkdir -p output/Payload
          ditto "$APP_PATH" "output/Payload/$(basename "$APP_PATH")"

          cd output
          zip -qry "$IPA_NAME" Payload
          unzip -t "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: output/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_number }}
          path: logs/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
