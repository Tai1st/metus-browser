plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.metus.background'
version = '0.1.0'

android {
  namespace "com.metus.background"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // HeadlessJsTaskContext / ReactContext
  implementation "com.facebook.react:react-android"
}
